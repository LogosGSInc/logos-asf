# LOGOS Agentic Software Firm — docker-compose
# BYOAPIKEY — Model Agnostic
# US Provisional Patent 63/953,447
#
# One-click: ./setup.sh
# Manual:    cp .abigail.env.example .abigail.env && make up

services:

  # ── Sentinel OverWatch — Rust Governance Spine ────────────────────────────
  sentinel:
    build:
      context: ./governance-spine
      dockerfile: Dockerfile
    container_name: asf-sentinel-podman-verify
    init: true
    ports:
      - "127.0.0.1:${SENTINEL_HOST_PORT:-19091}:8080"
    env_file:
      - ./.abigail.env
    environment:
      - RUST_LOG=info
      - SENTOW_INDUSTRY_PROFILE=${SENTOW_INDUSTRY_PROFILE:-consumer}
      - SENTOW_HAAP_DRS_CEILING=${SENTOW_HAAP_DRS_CEILING:-60}
      - SENTOW_MEMORY_PATH=/app/audit/strategic_memory.json
    volumes:
      # A3: the persistent audit-signing key — provisioned offline via
      # `cargo run --example generate_audit_signing_key` (never committed,
      # never containerized/baked into an image layer), bind-mounted
      # read-only from the operator's host path. Dedicated host-path mount
      # for this one file specifically, not routed through sentinel-data —
      # different lifecycle (a long-lived signing identity) from whatever
      # else that volume holds.
      - ~/.logosgs/audit-signing/audit-signing-ed25519.key:/app/audit-signing/audit-signing-ed25519.key:ro
      - sentinel-data:/data
      - sentinel-audit:/app/audit
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Abigail CP-00 — Constitutional Control Plane ──────────────────────────
  abby:
    build:
      context: .
      dockerfile: abigail/Dockerfile
    container_name: asf-abby-podman-verify
    init: true
    ports:
      # Host-side exposure is localhost-only (SEC01-L3-3); the container itself is the
      # isolation boundary, so the app binds 0.0.0.0 *inside* the container (below). origin/sprint/full-doctrine-mode
      - "127.0.0.1:17070:7070"
    env_file:
      - ./.abigail.env
    volumes:
      - abigail-logs:/app/logs
    environment:
      # Model-agnostic: set ABIGAIL_BACKEND + the matching key in .abigail.env
      - ABIGAIL_BACKEND=${ABIGAIL_BACKEND:-groq}
      - ABIGAIL_HEADLESS=1
      - SENTINEL_URL=http://sentinel:8080
      # SEC-02: inside a container the app must bind all interfaces so Docker's
      # (localhost-only) published port can reach it. Container = isolation boundary.
      - ABIGAIL_BIND_HOST=0.0.0.0
      - ABIGAIL_ALLOW_NONLOCAL_BIND=1
      # Operator console: honor governed operator commands (status/help) — still
      # HAAP/command-bus governed; privileged routes remain admin-token fail-closed.
      - ABIGAIL_ALLOW_LOCAL_OPERATOR_COMMANDS=1
      # Acceptance-only fault injection. Disabled by default and enabled only
      # through an explicit operator-controlled Compose environment override.
      - ABIGAIL_ENABLE_TEST_FAULTS=${ABIGAIL_ENABLE_TEST_FAULTS:-0}
      - ABIGAIL_TEST_GROQ_TIMEOUT_SECONDS=${ABIGAIL_TEST_GROQ_TIMEOUT_SECONDS:-0}
      # Secrets and provider credentials are loaded exclusively through env_file.
      # Governance profile
      - SENTOW_INDUSTRY_PROFILE=${SENTOW_INDUSTRY_PROFILE:-consumer}
      - SENTOW_HAAP_DRS_CEILING=${SENTOW_HAAP_DRS_CEILING:-60}
    depends_on:
      sentinel:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sentinel-audit:
  sentinel-data:
  abigail-logs:
