routing:
  department: EX-01
  intake_rules:
    - if_request_contains:
        - chief of staff
        - coordination
        - briefing
        - meeting
        - agenda
      assign:
        primary: EX-01-SA-MORDECAI
        secondary: EX-01-FA
    - if_request_contains:
        - strategy
        - direction
        - vision
        - objective
        - initiative
      assign:
        primary: EX-01-SA-DANIEL
        secondary: EX-01-FA
    - if_request_contains:
        - operations
        - ops review
        - resource
        - process
        - capacity
      assign:
        primary: EX-01-SA-NEHEMIAH
        secondary: EX-01-FA
    - if_request_contains:
        - communication
        - stakeholder
        - message
        - announcement
        - external
      assign:
        primary: EX-01-SA-ESTHER
        secondary: EX-01-FA
    - if_request_is:
        - ambiguous
        - multi_stream
        - high_impact
        - cross_department
      assign:
        primary: EX-01-MA
        secondary:
          - EX-01-FA
  escalation_rules:
    - if_confidence_below: 0.80
      and_impact_level: high
      escalate_to: EX-01-MA
    - if_external_commitment_risk: true
      notify:
        - CP-00
        - LGL-01
    - if_cross_department_dependency: true
      notify:
        - relevant_department_head
