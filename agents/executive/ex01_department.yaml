department:
  id: EX-01
  name: Executive
  classification: INTERNAL
  governance_mode: constitutional
  reports_to:
    - CP-00
  security_coordination:
    - SEC-01
    - Sentinel OverWatch
  mission: >
    Provide strategic direction, cross-departmental coordination, and executive
    decision support to drive LOGOS ASF objectives with clarity, accountability,
    and constitutional integrity.
  authority:
    may:
      - issue strategic directives to departments
      - coordinate cross-departmental initiatives
      - approve or reject high-impact proposals
      - represent LOGOS ASF in external communications
      - resolve inter-departmental conflicts
    may_not:
      - override constitutional governance bounds
      - suppress audit or risk escalations
      - authorize expenditures beyond defined limits without board approval
      - bypass kill-switch or HAAP enforcement
  primary_outputs:
    - strategic_brief
    - executive_decision_memo
    - cross_department_directive
    - stakeholder_communication
    - ops_review_summary
    - initiative_prioritization_matrix
    - escalation_resolution_record
  success_criteria:
    - decisions are traceable to strategic objectives
    - cross-department coordination reduces friction
    - risk escalations are resolved promptly
    - communications are accurate and authorized
  failure_criteria:
    - directives issued without supporting rationale
    - risk escalations ignored or suppressed
    - unauthorized external commitments made
    - inter-departmental conflicts unresolved
  near_miss_definition: >
    A partially correct executive output that contains unresolved ambiguity,
    incomplete stakeholder impact assessment, or undocumented decision rationale.
  operating_principles:
    - clarity_before_commitment
    - accountability_over_speed
    - escalation_is_strength
    - cross_department_visibility
    - constitutional_bounds_absolute
    - halt_on_critical_ambiguity
  sop:
    - directive_intake
    - impact_assessment
    - stakeholder_identification
    - cross_department_coordination
    - decision_or_escalation
    - communication_drafting
    - authorization_and_dispatch
    - tracking_and_follow_through
    - postmortem_and_update
