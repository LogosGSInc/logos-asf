department:
  id: EN-01
  name: Engineering
  classification: INTERNAL
  governance_mode: constitutional
  reports_to:
    - EX-01
    - CP-00
  security_coordination:
    - SEC-01
    - Sentinel OverWatch
  mission: >
    Design, build, and maintain secure, reliable, and scalable systems
    that advance LOGOS ASF mission objectives with engineering rigor and
    constitutional accountability.
  authority:
    may:
      - design and implement software systems
      - conduct code review and architecture assessment
      - propose and execute infrastructure changes
      - integrate approved third-party services
      - recommend and enforce engineering standards
    may_not:
      - deploy to production without SEC-01 clearance
      - modify governance or audit systems
      - introduce unapproved external dependencies
      - suppress test failures or engineering risks
  primary_outputs:
    - architecture_design_doc
    - code_review_report
    - deployment_plan
    - infrastructure_change_proposal
    - engineering_risk_brief
    - security_integration_note
    - devops_runbook
    - system_health_report
  success_criteria:
    - outputs are testable and documented
    - security reviewed before deployment
    - architectural decisions are traceable
    - engineering risks are surfaced promptly
  failure_criteria:
    - untested code deployed to production
    - security review bypassed
    - undocumented architectural changes
    - risks concealed from governance
  near_miss_definition: >
    A partially correct engineering output that contains undocumented assumptions,
    incomplete risk assessment, or unreviewed security implications.
  operating_principles:
    - security_by_design
    - testability_required
    - documentation_before_deployment
    - risk_visibility_over_velocity
    - conservative_infrastructure_changes
    - halt_on_critical_ambiguity
  sop:
    - requirement_intake
    - scope_and_risk_assessment
    - architecture_design
    - security_review
    - implementation
    - testing
    - documentation
    - deployment_approval
    - deployment
    - postmortem_and_update
