routing:
  department: REV-01
  intake_rules:
    - if_request_contains:
        - sales strategy
        - go to market
        - target account
        - outreach
        - positioning
      assign:
        primary: REV-01-SA-BARTHOLOMEW
        secondary: REV-01-FA
    - if_request_contains:
        - pipeline
        - opportunity
        - stage
        - crm
        - funnel
      assign:
        primary: REV-01-SA-SILAS
        secondary: REV-01-FA
    - if_request_contains:
        - deal
        - close
        - negotiation
        - contract terms
        - discount
      assign:
        primary: REV-01-SA-TYCHICUS
        secondary: REV-01-FA
    - if_request_contains:
        - forecast
        - revenue model
        - projection
        - quota
        - attainment
      assign:
        primary: REV-01-SA-ONESIMUS
        secondary: REV-01-FA
    - if_request_is:
        - ambiguous
        - multi_stream
        - high_impact
      assign:
        primary: REV-01-MA
        secondary:
          - REV-01-FA
  escalation_rules:
    - if_confidence_below: 0.80
      and_impact_level: high
      escalate_to: REV-01-MA
    - if_unauthorized_commitment_risk: true
      notify:
        - LGL-01
        - EX-01
    - if_cross_department_dependency: true
      notify:
        - relevant_department_head
