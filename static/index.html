<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LOGOS ASF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #eef2ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(680px, 92vw);
      padding: 32px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: rgba(255,255,255,.05);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; }
    p { color: #aeb7d8; line-height: 1.6; }
    .grid { display: grid; gap: 14px; margin-top: 24px; }
    a {
      display: block;
      padding: 18px 20px;
      border-radius: 14px;
      color: #eef2ff;
      text-decoration: none;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
    }
    a:hover { background: rgba(255,255,255,.13); }
    small { display: block; color: #aeb7d8; margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>LOGOS ASF</h1>
    <p>Governed agentic software firm interface. Choose an operating surface.</p>

    <div class="grid">
      <a href="dashboard.html">
        Operator Console
        <small>Abigail CP-00 · Sentinel OverWatch · governance spine monitoring and chat.</small>
      </a>

      <a href="intake.html">
        Job Order Intake
        <small>Structured intake form for governed ASF mission creation.</small>
      </a>
    </div>
  </main>
</body>
</html>
