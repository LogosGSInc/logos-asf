<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- SECURITY: Content Security Policy — same-origin scripts only, no eval,
     fonts from trusted CDN only. Blocks XSS escalation even if a payload
     reaches an unescaped innerHTML path. -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src https://api.fontshare.com https://cdn.fontshare.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';">
<meta name="referrer" content="no-referrer">
<title>ASF Operator Console — LOGOS Governance Systems</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=cabinet-grotesk@700,800,900&display=swap" rel="stylesheet">
<style>
/* ── TOKENS (matched to intake.html) ── */
:root{
  --bg:#0d0d0b;--surface:#141412;--surface-2:#1a1a18;--surface-3:#202020;
  --border:rgba(255,255,255,0.07);--border-hi:rgba(255,255,255,0.16);
  --text:#e6e4de;--muted:#8c8a84;--faint:#4a4845;
  --primary:#4f98a3;--primary-h:#3a8390;--primary-glow:rgba(79,152,163,0.14);
  --gold:#e8af34;--gold-glow:rgba(232,175,52,0.12);
  --success:#6daa45;--success-glow:rgba(109,170,69,0.12);
  --error:#dd6974;--error-glow:rgba(221,105,116,0.12);
  --warning:#fdab43;--warning-glow:rgba(253,171,67,0.12);
  --info:#5f9ec4;--info-glow:rgba(95,158,196,0.12);
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-xl:22px;--r-pill:999px;
  --font-d:"Cabinet Grotesk",sans-serif;
  --font-b:"Satoshi",sans-serif;
  --font-m:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  --ease:180ms cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100dvh;font-family:var(--font-b);font-size:1rem;color:var(--text);background:var(--bg);overflow-x:hidden}

/* ── SHELL ── */
.shell{max-width:1440px;margin:0 auto;padding:1.5rem 1.5rem 4rem}

/* ── HEADER ── */
.app-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.75rem}
.brand svg{width:34px;height:34px;flex-shrink:0}
.brand-block{display:flex;flex-direction:column;line-height:1.2}
.brand-name{font-family:var(--font-d);font-size:1.0625rem;font-weight:900;letter-spacing:-.02em}
.brand-name em{color:var(--primary);font-style:normal}
.brand-sub{font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:.1rem}
.header-actions{display:flex;align-items:center;gap:.625rem;flex-wrap:wrap}
.refresh-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:.55rem 1rem;color:var(--text);font-family:var(--font-b);font-size:.8125rem;font-weight:600;cursor:pointer;transition:all var(--ease);display:inline-flex;align-items:center;gap:.4rem}
.refresh-btn:hover{border-color:var(--primary);color:var(--primary)}
.live-pulse{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 var(--success-glow);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(109,170,69,.6)}70%{box-shadow:0 0 0 8px rgba(109,170,69,0)}100%{box-shadow:0 0 0 0 rgba(109,170,69,0)}}

/* ── NAV TABS ── */
.nav-rail{display:grid;grid-template-columns:repeat(5,1fr);gap:.5rem;margin-bottom:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:.5rem}
.nav-rail button{background:transparent;border:1px solid transparent;border-radius:var(--r-md);padding:.75rem 1rem;color:var(--muted);font-family:var(--font-b);font-size:.8125rem;font-weight:700;cursor:pointer;transition:all var(--ease);text-align:left;display:flex;flex-direction:column;gap:.15rem;line-height:1.3}
.nav-rail button:hover{background:var(--surface-2);color:var(--text)}
.nav-rail button.active{background:var(--surface-3);color:var(--primary);border-color:var(--border-hi)}
.nav-rail button small{font-weight:500;font-size:.7rem;color:var(--faint);letter-spacing:.02em}
.nav-rail button.active small{color:var(--muted)}

/* ── METRICS ROW ── */
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:.875rem;margin-bottom:1.5rem}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1rem 1.125rem;transition:border-color var(--ease)}
.metric:hover{border-color:var(--border-hi)}
.metric .label{font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.4rem}
.metric .value{font-family:var(--font-d);font-size:1.625rem;font-weight:900;letter-spacing:-.02em;color:var(--text)}
.metric .sub{font-size:.7rem;color:var(--faint);margin-top:.3rem;line-height:1.4}

/* ── TABS ── */
.tab{display:none}
.tab.active{display:block}

/* ── CARDS / PANELS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:1.5rem}
.panel{margin-bottom:1.25rem}
.card h3{font-family:var(--font-d);font-size:1.0625rem;font-weight:800;letter-spacing:-.01em;margin-bottom:.25rem}
.card h4{font-family:var(--font-d);font-size:.9375rem;font-weight:800;letter-spacing:-.01em}

/* ── ROWS / GRIDS ── */
.row{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.section{margin-top:1rem}
.grid{display:grid;gap:1.25rem}
.grid.two{grid-template-columns:1fr 1fr}
.grid.overview{grid-template-columns:2fr 1fr}

/* ── DEPARTMENTS GRID ── */
.department-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:.875rem;margin-top:1rem}
.dept{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.125rem;transition:all var(--ease)}
.dept:hover{border-color:var(--border-hi);background:var(--surface-3)}
.dept h4{font-family:var(--font-d);font-size:.9375rem;font-weight:900;margin-bottom:.1rem}
.dept .small{font-size:.8125rem;color:var(--text)}
.dept .tiny{font-size:.7rem;color:var(--muted)}

/* ── BAR / PROGRESS ── */
.bar{height:6px;background:var(--surface-3);border-radius:var(--r-pill);overflow:hidden;margin-top:.4rem}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--primary),#67b5c0);border-radius:var(--r-pill);transition:width var(--ease)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.875rem;padding-top:.875rem;border-top:1px solid var(--border)}
.kpi{display:flex;flex-direction:column;gap:.15rem}
.kpi strong{font-size:.875rem;font-weight:800;color:var(--text)}

/* ── STATUS DOT ── */
.status{display:inline-flex;align-items:center;gap:.4rem;font-size:.7rem;font-weight:700;padding:.3rem .55rem;border-radius:var(--r-pill);background:var(--surface-3);border:1px solid var(--border)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--success);box-shadow:0 0 6px var(--success-glow)}
.dot.yellow{background:var(--warning);box-shadow:0 0 6px var(--warning-glow)}
.dot.red{background:var(--error);box-shadow:0 0 6px var(--error-glow)}
.dot.blue{background:var(--info);box-shadow:0 0 6px var(--info-glow)}
.status.green{color:var(--success);border-color:rgba(109,170,69,.3);background:var(--success-glow)}
.status.yellow{color:var(--warning);border-color:rgba(253,171,67,.3);background:var(--warning-glow)}
.status.red{color:var(--error);border-color:rgba(221,105,116,.3);background:var(--error-glow)}
.status.blue{color:var(--info);border-color:rgba(95,158,196,.3);background:var(--info-glow)}

/* ── DEPT ACTION BUTTONS ── */
.dept-actions{display:flex;gap:.5rem;margin-top:.875rem}
.mini{flex:1;padding:.5rem .65rem;border-radius:var(--r-sm);font-family:var(--font-b);font-size:.7rem;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface-3);color:var(--muted);transition:all var(--ease)}
.mini:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.mini:disabled{opacity:.5;cursor:not-allowed}
.mini.kill:hover:not(:disabled){border-color:var(--error);color:var(--error)}
.mini.restart:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}

/* ── HEALTH LIST ── */
.health-list{display:flex;flex-direction:column;gap:.625rem}
.health-item{display:flex;align-items:center;justify-content:space-between;gap:1rem;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:.75rem 1rem}
.health-item strong{font-size:.875rem;font-weight:700}

/* ── TABLES ── */
.jobs-table,.agent-table{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.8125rem}
.jobs-table th,.agent-table th{text-align:left;padding:.625rem .75rem;background:var(--surface-2);border-bottom:1px solid var(--border-hi);color:var(--muted);font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.jobs-table td,.agent-table td{padding:.625rem .75rem;border-bottom:1px solid var(--border);color:var(--text)}
.jobs-table tr:hover,.agent-table tr:hover{background:var(--surface-2)}

/* ── CHAT PANEL ── */
.chat-panel{display:grid;grid-template-rows:auto 1fr auto;height:calc(100vh - 340px);min-height:500px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);overflow:hidden}
.chat-header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.chat-title{display:flex;flex-direction:column;gap:.15rem}
.chat-title strong{font-family:var(--font-d);font-size:.9375rem;font-weight:800}
.chat-title small{font-size:.7rem;color:var(--muted);letter-spacing:.04em}
.chat-pills{display:flex;gap:.4rem;flex-wrap:wrap}
.chat-stream{overflow-y:auto;padding:1.25rem 1.5rem;display:flex;flex-direction:column;gap:1rem;scrollbar-width:thin;scrollbar-color:var(--border-hi) transparent}
.chat-stream::-webkit-scrollbar{width:8px}
.chat-stream::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:4px}
.msg{display:flex;flex-direction:column;gap:.4rem;max-width:85%}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.agent,.msg.sys{align-self:flex-start;align-items:flex-start}
.msg .role{font-size:.65rem;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:.4rem}
.bubble{padding:.75rem 1rem;border-radius:var(--r-md);font-size:.875rem;line-height:1.55;word-wrap:break-word;white-space:pre-wrap}
.msg.user .bubble{background:var(--primary);color:#fff;border:1px solid var(--primary-h)}
.msg.agent .bubble{background:var(--surface-2);color:var(--text);border:1px solid var(--border-hi)}
.msg.sys .bubble{background:var(--surface-3);color:var(--muted);border:1px dashed var(--border-hi);font-size:.8125rem;font-style:italic}
.msg.blocked .bubble{background:var(--error-glow);color:var(--error);border:1px solid rgba(221,105,116,.4)}
.msg .meta{font-size:.65rem;color:var(--faint);font-family:var(--font-m);letter-spacing:.04em}
.msg .drift{font-size:.7rem;color:var(--warning);font-style:italic}
.bubble code{background:var(--surface);border:1px solid var(--border);padding:.1rem .35rem;border-radius:var(--r-sm);font-family:var(--font-m);font-size:.8125rem}
.bubble pre{background:var(--surface);border:1px solid var(--border);padding:.75rem;border-radius:var(--r-md);overflow-x:auto;margin:.5rem 0;font-family:var(--font-m);font-size:.8125rem}
.copy-btn{background:transparent;border:none;color:var(--faint);cursor:pointer;font-size:.7rem;padding:.15rem .4rem;border-radius:var(--r-sm);transition:all var(--ease)}
.copy-btn:hover{color:var(--primary);background:var(--primary-glow)}
.thinking{font-size:.75rem;color:var(--muted);font-style:italic;align-self:flex-start;padding-left:.5rem}
.chat-composer{padding:1rem 1.25rem;border-top:1px solid var(--border);background:var(--surface-2)}
.composer-row{display:flex;gap:.625rem;align-items:flex-end}
.chat-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:.75rem .875rem;color:var(--text);font-family:var(--font-b);font-size:.875rem;resize:none;min-height:44px;max-height:130px;line-height:1.5;transition:border-color var(--ease),box-shadow var(--ease)}
.chat-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.chat-input::placeholder{color:var(--faint)}
.send-btn{background:var(--primary);color:#fff;border:none;border-radius:var(--r-md);padding:.75rem 1.25rem;font-family:var(--font-b);font-size:.875rem;font-weight:700;cursor:pointer;transition:all var(--ease);min-height:44px;white-space:nowrap}
.send-btn:hover:not(:disabled){background:var(--primary-h);transform:translateY(-1px)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.composer-rail{display:flex;align-items:center;justify-content:space-between;gap:.625rem;margin-top:.625rem;flex-wrap:wrap}
.slash-chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip-cmd{background:var(--surface-3);border:1px solid var(--border);color:var(--muted);font-family:var(--font-m);font-size:.7rem;font-weight:700;padding:.3rem .55rem;border-radius:var(--r-sm);cursor:pointer;transition:all var(--ease)}
.chip-cmd:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-glow)}
.composer-meta{font-size:.65rem;color:var(--faint);letter-spacing:.04em}
.composer-meta kbd{background:var(--surface-3);border:1px solid var(--border);border-radius:3px;padding:.05rem .3rem;font-family:var(--font-m);font-size:.65rem;color:var(--muted)}
.chat-clear{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.7rem;padding:.3rem .6rem;border-radius:var(--r-sm);cursor:pointer;transition:all var(--ease)}
.chat-clear:hover{color:var(--error);border-color:var(--error)}

/* ── RESPONSE BOX (kept for reference panels) ── */
.response-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:1rem;font-family:var(--font-m);font-size:.8125rem;color:var(--muted);white-space:pre-wrap;max-height:340px;overflow-y:auto}

/* ── AUDIT TAIL ── */
.audit-tail{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:.75rem;max-height:300px;overflow-y:auto;font-family:var(--font-m);font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;gap:.4rem}
.audit-row{display:flex;gap:.625rem;padding:.3rem 0;border-bottom:1px solid var(--border);line-height:1.4;cursor:pointer;transition:background var(--ease)}
.audit-row:hover{background:var(--surface-3);border-radius:var(--r-sm);padding:.3rem .4rem}
.audit-row:last-child{border-bottom:none}
.audit-row.expanded{flex-direction:column;gap:.3rem;background:var(--surface-3);border-radius:var(--r-sm);padding:.5rem .6rem}
.audit-row.expanded .audit-data{font-size:.7rem;white-space:pre-wrap;word-break:break-word}
.audit-row.expanded .audit-head{display:flex;gap:.625rem}
.audit-ts{color:var(--faint);flex-shrink:0;min-width:130px}
.audit-type{color:var(--primary);font-weight:700;flex-shrink:0;min-width:170px}
.audit-data{color:var(--text);word-break:break-word;font-size:.65rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.audit-truncated{color:var(--gold);margin-left:.3rem}

/* ── E-BRAKE ── */
.ebrake-box{background:linear-gradient(135deg,rgba(221,105,116,.06),rgba(232,175,52,.06));border:1px solid var(--error);border-radius:var(--r-lg);padding:1.25rem;margin-top:1rem}
.ebrake-title{font-family:var(--font-d);font-size:1rem;font-weight:900;color:var(--error);margin-bottom:.4rem;display:flex;align-items:center;gap:.5rem}
.ebrake-desc{font-size:.8125rem;color:var(--muted);line-height:1.5;margin-bottom:1rem}
.ebrake-actions{display:flex;gap:.5rem;flex-wrap:wrap}
.btn-ebrake{background:var(--error);color:#fff;border:none;border-radius:var(--r-md);padding:.75rem 1.5rem;font-family:var(--font-b);font-size:.875rem;font-weight:800;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:all var(--ease)}
.btn-ebrake:hover{background:#c8525d;transform:translateY(-1px);box-shadow:0 4px 14px var(--error-glow)}
.btn-ebrake.armed{background:var(--success);}
.btn-ebrake.armed:hover{background:#5d9438}
.btn-clear{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:var(--r-md);padding:.75rem 1.25rem;font-family:var(--font-b);font-size:.8125rem;font-weight:700;cursor:pointer;transition:all var(--ease)}
.btn-clear:hover{color:var(--text);border-color:var(--border-hi)}

/* ── RESPONSIVE ── */
@media(max-width:1100px){
  .metrics{grid-template-columns:repeat(3,1fr)}
  .grid.overview{grid-template-columns:1fr}
  .grid.two{grid-template-columns:1fr}
}
@media(max-width:700px){
  .nav-rail{grid-template-columns:repeat(2,1fr)}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .department-grid{grid-template-columns:1fr}
  .shell{padding:1rem 1rem 3rem}
  .chat-panel{height:calc(100vh - 300px)}
}
</style>
</head>
<body>
<div class="shell">

<!-- ── HEADER ── -->
<header class="app-header">
  <div class="brand">
    <svg viewBox="0 0 34 34" fill="none" aria-label="Logos Governance Systems">
      <rect width="34" height="34" rx="8" fill="#141412"/>
      <polygon points="17,3 30,10 30,24 17,31 4,24 4,10" fill="none" stroke="#4f98a3" stroke-width="1.5"/>
      <polygon points="17,8 25,13 25,21 17,26 9,21 9,13" fill="none" stroke="#4f98a3" stroke-width=".8" opacity=".45"/>
      <circle cx="17" cy="17" r="3" fill="#4f98a3"/>
    </svg>
    <div class="brand-block">
      <div class="brand-name">LOGOS <em>ASF</em> · Operator Console</div>
      <div class="brand-sub">Abigail CP-00 · Sentinel OverWatch · Governance Spine</div>
    </div>
  </div>
  <div class="header-actions">
    <span id="refreshStatus" style="font-size:.7rem;color:var(--faint);letter-spacing:.04em">Initializing…</span>
    <span class="status green"><span class="live-pulse"></span>Live · auto-refresh 15s</span>
    <button id="refreshBtn" class="refresh-btn">↻ Refresh now</button>
  </div>
</header>

<!-- ── NAV TABS ── -->
<nav id="nav" class="nav-rail" role="tablist"></nav>

<!-- ── METRICS ── -->
<div id="metrics" class="metrics"></div>

<!-- ── TABS ── -->
<div id="tab-overview" class="tab active"></div>
<div id="tab-chat" class="tab"></div>
<div id="tab-departments" class="tab"></div>
<div id="tab-agents" class="tab"></div>
<div id="tab-governance" class="tab"></div>

</div>

<script>
/* ─────────────────────────────────────────────────────────────────────
   ENDPOINTS — all same-origin. Sentinel is reached via Abigail proxy.
   This works everywhere: localhost, Docker, Codespaces, VPS, reverse proxy.
   Abigail proxies /api/sentinel-health → http://sentinel:8080/health
   over the Docker network (server-side, not browser-side).
   ───────────────────────────────────────────────────────────────────── */
const ENDPOINTS = {
  abigailBase: "",  /* same-origin */
};

/* ── 12-DEPARTMENT DOCTRINE STACK ── */
const doctrine = [
  { code:"EXE", name:"Executive / Command", lead:"EXE-01 (Chief Executive Agent)", sensitivity:"Critical", role:"Command", status:"green" },
  { code:"ENG", name:"Engineering", lead:"ENG-01 (Chief Engineering Agent)", sensitivity:"Critical", role:"Build", status:"green" },
  { code:"PRD", name:"Product", lead:"PRD-01 (Chief Product Agent)", sensitivity:"High", role:"Specification", status:"green" },
  { code:"SEC", name:"Security", lead:"SEC-01 (Chief Security Agent)", sensitivity:"Critical", role:"Defense", status:"green" },
  { code:"LGL", name:"Legal", lead:"LGL-01 (Chief Legal Agent)", sensitivity:"Critical", role:"Review", status:"yellow" },
  { code:"FIN", name:"Finance", lead:"FIN-01 (Chief Financial Agent)", sensitivity:"Critical", role:"Financial Ground Truth", status:"green" },
  { code:"OPS", name:"Operations", lead:"OPS-01 (Chief Operations Agent)", sensitivity:"High", role:"Runtime Reliability", status:"green" },
  { code:"REV", name:"Revenue / Sales", lead:"REV-01 (Chief Revenue Agent)", sensitivity:"High", role:"Pilot-to-License", status:"green" },
  { code:"MKT", name:"Marketing", lead:"MKT-01 (Marketing Director Agent)", sensitivity:"High", role:"External Narrative", status:"green" },
  { code:"HR",  name:"People / HR", lead:"HR-01 (Chief People Agent)", sensitivity:"High", role:"People + Agent Workforce", status:"green" },
  { code:"DAT", name:"Data", lead:"DAT-01 (Chief Data Agent)", sensitivity:"High", role:"Analytics + Pipelines", status:"green" },
  { code:"GRC", name:"Governance, Risk & Compliance", lead:"GRC-01 (Chief GRC Agent)", sensitivity:"Critical", role:"Policy + Risk", status:"green" }
];

function buildDepartmentState() {
  return doctrine.map((d, i) => ({
    ...d,
    alignment: 92 - ((i * 3) % 14),
    completion: 38 + ((i * 7) % 46),
    tokenUsage: 12000 + i * 2450,
    activeJobs: 1 + (i % 5),

/* ── HELPERS ── */
function badge(status, label) {
  return `<span class="status ${status}"><span class="dot ${status}"></span>${label}</span>`;
}
function pctBar(value) {
  const v = Math.max(0, Math.min(100, value));
  return `<div class="bar"><div class="fill" style="width:${v}%"></div></div>`;
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
/* Governance-safe markdown bubble renderer.
   Escapes everything first, then promotes ONLY:
     - ```...``` fenced blocks → <pre><code>
     - `...`     inline        → <code>
     - newlines               → preserved via white-space:pre-wrap (CSS)
   No other HTML promotion. No XSS surface. */
function renderBubble(text) {
  let s = escapeHtml(text);
  s = s.replace(/```([a-zA-Z0-9]*)\n?([\s\S]*?)```/g, (_, lang, body) =>
    `<pre><code data-lang="${escapeHtml(lang)}">${body.replace(/^\n+|\n+$/g, "")}</code></pre>`);
  s = s.replace(/`([^`\n]+?)`/g, (_, body) => `<code>${body}</code>`);
  return s;
}
function formatTs(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toISOString().replace("T"," ").slice(5, 19) + "Z"; }
  catch { return iso; }
}
/* Render one audit row. Click to expand full JSON.
   Shows '⤵ more' indicator when data is truncated. */
function renderAuditRow(e, idx, maxLen) {
  const fullJson = JSON.stringify(e.data || {}, null, 2);
  const oneLine = JSON.stringify(e.data || {});
  const truncated = oneLine.length > maxLen;
  const preview = truncated ? oneLine.slice(0, maxLen) : oneLine;
  return `
    <div class="audit-row" data-idx="${idx}" data-full="${escapeHtml(fullJson)}" onclick="toggleAuditRow(this)">
      <span class="audit-ts">${formatTs(e.ts)}</span>
      <span class="audit-type">${escapeHtml(e.event_type)}</span>
      <span class="audit-data">${escapeHtml(preview)}${truncated ? '<span class="audit-truncated">⤵ more</span>' : ''}</span>
    </div>
  `;
}
function toggleAuditRow(el) {
  if (el.classList.contains("expanded")) {
    el.classList.remove("expanded");
    el.innerHTML = el._collapsedHtml || el.innerHTML;
    return;
  }
  el._collapsedHtml = el.innerHTML;
  const ts = el.querySelector(".audit-ts")?.textContent || "";
  const type = el.querySelector(".audit-type")?.textContent || "";
  const full = el.dataset.full || "{}";
  el.classList.add("expanded");
  // SECURITY FIX: use textContent for the full JSON block to prevent XSS
  // (audit log entries from the backend are untrusted and must not be HTML-injected)
  el.innerHTML = `
    <div class="audit-head">
      <span class="audit-ts">${escapeHtml(ts)}</span>
      <span class="audit-type">${escapeHtml(type)}</span>
    </div>
    <div class="audit-data"></div>
  `;
  el.querySelector(".audit-data").textContent = full;
}

async function getJSON(url) {
  const res = await fetch(url, { headers: { "Accept":"application/json" } });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}
async function postJSON(url, payload) {
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type":"application/json", "Accept":"application/json" },
    body: JSON.stringify(payload || {})
  });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

/* ── LIVE REFRESH ──
   Hot path: hits 3 endpoints, updates state, then ONLY re-renders
   pieces that should change on poll (metrics + active tab's live bits).
   Critically: does NOT re-render the chat tab if the user is interacting.
   That would destroy the textarea, kill focus, and erase mid-typed messages.
*/
async function refreshLive() {
  const refreshStart = Date.now();
  let abigail = null, sentinel = null, audit = [];
  try { abigail = await getJSON(`${ENDPOINTS.abigailBase}/api/status`); }
  catch (e) { abigail = { error: String(e) }; }
  try { sentinel = await getJSON(`${ENDPOINTS.abigailBase}/api/sentinel-health`); }
  catch (e) { sentinel = { error: String(e) }; }
  try {
    const t = await getJSON(`${ENDPOINTS.abigailBase}/api/audit-tail?n=25`);
    audit = Array.isArray(t.entries) ? t.entries : [];
  } catch (e) { /* tail endpoint may not be live yet — non-fatal */ }
  state.abigail = abigail;
  state.sentinel = sentinel;
  state.audit = audit;
  state.lastRefresh = new Date();
  state.lastRefreshError = (abigail?.error || sentinel?.error) ? true : false;
  refreshSelective();
  updateRefreshStatus();
}

/* Refresh only the parts that should update on poll. Active-tab-aware. */
function refreshSelective() {
  renderMetrics();
  const activeTab = document.querySelector(".tab.active")?.id?.replace("tab-","") || "overview";
  if (activeTab === "overview")    renderOverview();
  if (activeTab === "departments") renderDepartments();
  if (activeTab === "agents")      renderAgents();
  if (activeTab === "governance")  renderGovernance();
  /* Chat: NEVER re-render the stream/composer while user may be typing.
     Only update the header pills (backend / KS / CRSV). */
  if (activeTab === "chat") refreshChatHeader();
}

function refreshChatHeader() {
  const pills = document.querySelector(".chat-pills");
  if (!pills) return;
  const ks = state.abigail?.kill_switch;

  const crsv = state.abigail?.crsv ?? 0;
  pills.innerHTML = `

    ${badge("blue", `Backend: ${backend}`)}
    ${badge("blue", `CRSV ${typeof crsv === "number" ? crsv.toFixed(1) : crsv}`)}
  `;
}

function updateRefreshStatus() {
  const el = document.getElementById("refreshStatus");
  if (!el) return;
  const t = state.lastRefresh
    ? state.lastRefresh.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })
    : "—";
  const err = state.lastRefreshError;
  // SECURITY FIX: build spans via DOM API instead of innerHTML to avoid any
  // XSS if lastRefreshError ever carries a server-sourced string
  el.textContent = "";
  const span = document.createElement("span");
  span.style.color = err ? "var(--warning)" : "var(--faint)";
  span.textContent = err
    ? `⚠ Last refresh ${t} · service unreachable`
    : `Last refresh ${t}`;
  el.appendChild(span);
}

/* ── CHAT WIRING ── */
function wireChat() {
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const clearBtn = document.getElementById("chatClear");
  const stream = document.getElementById("chatStream");
  if (!input || !sendBtn || !stream) return;

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
  sendBtn.onclick = handleSend;
  clearBtn.onclick = () => {
    state.chat = [{ id:"sys-cleared", role:"sys", text:"Conversation cleared. Audit log preserved server-side.", meta:null, drift:null }];
    renderChat();
  };
  document.querySelectorAll(".chip-cmd").forEach(chip => {
    chip.onclick = () => {
      input.value = chip.dataset.cmd + " ";
      input.focus();
      input.dispatchEvent(new Event("input"));
    };
  });

  stream.scrollTop = stream.scrollHeight;
  setTimeout(() => input.focus(), 30);
}

function pushChat(role, text, meta, drift) {
  state.chat.push({
    id: `m-${Date.now()}-${Math.random().toString(16).slice(2,6)}`,
    role, text, meta: meta || null, drift: drift || null
  });
}

async function handleSend() {
  const input = document.getElementById("chatInput");
  if (!input || state.chatBusy) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "auto";

  /* slash commands resolved client-side first */
  if (text.startsWith("/")) {
    await handleSlash(text);
    return;
  }

  pushChat("user", text);
  state.chatBusy = true;
  renderChat();

  try {
    const result = await postJSON(`${ENDPOINTS.abigailBase}/api/chat`, { message: text });
    state.chatBusy = false;
    if (result.ok) {
      pushChat("agent", result.text,
        `DRS ${result.drs}/100 · ${result.mode} · CRSV ${result.crsv}`,
        result.drift || null);
    } else {
      pushChat("blocked", result.text || "Blocked by HAAP.", `Mode ${result.mode || "BLOCKED"}`);
    }
    renderChat();
    refreshLive();
  } catch (err) {
    state.chatBusy = false;
    pushChat("blocked", `Network error · ${String(err)}`);
    renderChat();
  }
}

async function handleSlash(text) {
  const [verb, ...rest] = text.trim().split(/\s+/);
  pushChat("user", text);
  state.chatBusy = true;
  renderChat();

  try {
    if (verb === "/help") {
      pushChat("sys", `Slash commands:
  /status              — current Abigail/Sentinel state
  /audit [n]           — last N audit entries (default 10)
  /kill                — activate kill switch (halts execution)
  /clear-kill          — clear kill switch (requires principal)
  /help                — this message

Anything not starting with / goes through /api/chat with full HAAP enforcement.`);
    }
    else if (verb === "/status") {
      const a = await getJSON(`${ENDPOINTS.abigailBase}/api/status`);
      pushChat("sys", `Abigail: backend=${a.backend} turns=${a.turns} crsv=${a.crsv} kill_switch=${a.kill_switch} version=${a.version}`);
    }
    else if (verb === "/audit") {
      const n = parseInt(rest[0], 10) || 10;
      const t = await getJSON(`${ENDPOINTS.abigailBase}/api/audit-tail?n=${n}`);
      const entries = t.entries || [];
      const lines = entries.map(e => `[${formatTs(e.ts)}] ${e.event_type}`).join("\n");
      pushChat("sys", lines || "No audit entries.");
    }
    else if (verb === "/kill") {
      const r = await postJSON(`${ENDPOINTS.abigailBase}/api/ebrake`, { principal: "DASHBOARD" });
      pushChat("sys", r.ok ? "🛑 KILL SWITCH ACTIVATED. All execution halted." : `Failed: ${escapeHtml(String(r.error || "unknown"))}`);
    }
    else if (verb === "/clear-kill") {
      // SECURITY FIX: removed prompt() — principal must be supplied inline as
      // "/clear-kill <name>". If omitted, guide the operator instead.
      const principal = rest.join(" ").trim();
      if (!principal) {
        pushChat("sys", "Usage: /clear-kill <principal-name>  (principal required for audit integrity)");
      } else {
        const r = await postJSON(`${ENDPOINTS.abigailBase}/api/ebrake/clear`, { principal });
        pushChat("sys", r.ok ? `✓ Kill switch cleared by ${escapeHtml(principal)}.` : `Failed: ${escapeHtml(String(r.error || "unknown"))}`);
      }
    }
    else {
      pushChat("sys", `Unknown command: ${verb} — type /help`);
    }
  } catch (err) {
    pushChat("blocked", `Command failed: ${String(err)}`);
  }
  state.chatBusy = false;
  renderChat();

/* SECURITY FIX: Replaced browser prompt()/confirm()/alert() with inline DOM
   controls. Native dialogs are blocked in Codespaces/embedded iframes,
   phishable, and hostile for an operator console.
   Activate uses a 2-step "click twice within 5s" arming pattern.
   Clear uses an inline text input for the required principal name. */
function showEbrakeNotice(msg, isError) {
  let notice = document.getElementById("ebrakeNotice");
  if (!notice) {
    notice = document.createElement("p");
    notice.id = "ebrakeNotice";
    notice.style.cssText = "margin:.5rem 0 0;font-size:.8125rem;font-weight:600;";
    const box = document.querySelector(".ebrake-box");
    if (box) box.appendChild(notice);
  }
  notice.style.color = isError ? "var(--error)" : "var(--success)";
  notice.textContent = msg;
  setTimeout(() => { notice.textContent = ""; }, 8000);
}

function wireGovernance() {
  const fire = document.getElementById("ebrakeFire");
  const clear = document.getElementById("ebrakeClear");

  if (fire) {
    let armed = false;
    fire.onclick = async () => {
      if (!armed) {
        armed = true;
        fire.textContent = "⚠ Confirm halt — click again";
        fire.classList.add("armed");
        setTimeout(() => {
          armed = false;
          fire.textContent = "🛑 Activate kill switch";
          fire.classList.remove("armed");
        }, 5000);
        return;
      }
      armed = false;
      fire.disabled = true;
      fire.textContent = "Activating…";
      try {
        const r = await postJSON(`${ENDPOINTS.abigailBase}/api/ebrake`, { principal: "DASHBOARD-OPERATOR" });
        showEbrakeNotice(r.ok ? "✓ Kill switch activated. All execution halted." : `Failed: ${escapeHtml(String(r.error || "unknown"))}`, !r.ok);
        await refreshLive();
      } catch (e) {
        showEbrakeNotice(`Error: ${escapeHtml(String(e))}`, true);
      } finally {
        fire.disabled = false;
        fire.textContent = "🛑 Activate kill switch";
        fire.classList.remove("armed");
      }
    };
  }

  if (clear) {
    let principalInput = document.getElementById("ebrakePrincipal");
    if (!principalInput) {
      principalInput = document.createElement("input");
      principalInput.id = "ebrakePrincipal";
      principalInput.type = "text";
      principalInput.placeholder = "Principal name (required)";
      principalInput.maxLength = 80;
      principalInput.style.cssText = [
        "background:var(--surface-3)", "border:1px solid var(--border)",
        "border-radius:var(--r-sm)", "color:var(--text)", "font-family:var(--font-b)",
        "font-size:.8125rem", "padding:.55rem .75rem", "flex:1", "min-width:160px"
      ].join(";");
      clear.parentNode.insertBefore(principalInput, clear);
    }
    clear.onclick = async () => {
      const principal = principalInput.value.trim();
      if (!principal) {
        showEbrakeNotice("Principal name required to clear kill switch.", true);
        principalInput.focus();
        return;
      }
      clear.disabled = true;
      clear.textContent = "Clearing…";
      try {
        const r = await postJSON(`${ENDPOINTS.abigailBase}/api/ebrake/clear`, { principal });
        showEbrakeNotice(
          r.ok ? `✓ Kill switch cleared by ${escapeHtml(principal)}.` : `Failed: ${escapeHtml(String(r.error || "unknown"))}`,
          !r.ok
        );
        if (r.ok) principalInput.value = "";
        await refreshLive();
      } catch (e) {
        showEbrakeNotice(`Error: ${escapeHtml(String(e))}`, true);
      } finally {
        clear.disabled = false;
        clear.textContent = "Clear kill switch";
      }
    };
  }
}
