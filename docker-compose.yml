# LOGOS Agentic Software Firm — docker-compose
# BYOAPIKEY — Model Agnostic
# US Provisional Patent 63/953,447
#
# One-click: ./setup.sh
# Manual:    cp .abigail.env.example .abigail.env && make up

services:

  # ── Sentinel OverWatch — Rust Governance Spine ────────────────────────────
  sentinel:
    build:
      context: ./governance-spine
      dockerfile: Dockerfile
    container_name: asf-sentinel
    ports:
      # SEC-03 DOCK-01: publish only to the loopback interface. The container
      # still binds 0.0.0.0:8080 internally (SENTOW_BIND) so Abigail reaches it
      # over the Docker network (SENTINEL_URL=http://sentinel:8080); only the
      # HOST publish is scoped to localhost, closing the all-interfaces exposure.
      - "127.0.0.1:${SENTINEL_HOST_PORT:-9091}:8080"
    environment:
      - RUST_LOG=info
      - SENTOW_INDUSTRY_PROFILE=${SENTOW_INDUSTRY_PROFILE:-consumer}
      - SENTOW_HAAP_DRS_CEILING=${SENTOW_HAAP_DRS_CEILING:-60}
      - SENTOW_MEMORY_PATH=/app/audit/strategic_memory.json
      # SEC-03 DOCK-02: shared secret for route auth. If unset, the server fails
      # closed (503) on all non-/health routes.
      - SENTINEL_ADMIN_TOKEN=${SENTINEL_ADMIN_TOKEN}
    volumes:
      - sentinel-audit:/app/audit
      - sentinel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Abigail CP-00 — Constitutional Control Plane ──────────────────────────
  abby:
    build:
      context: .
      dockerfile: abigail/Dockerfile
    container_name: asf-abby
    ports:
      # Host-side exposure is localhost-only (SEC01-L3-3); the container itself is the
      # isolation boundary, so the app binds 0.0.0.0 *inside* the container (below).
      - "127.0.0.1:7070:7070"
    env_file:
      - ./.abigail.env
    volumes:
      - ./.abigail.env:/app/.abigail.env:ro
      - abigail-logs:/app/logs
    environment:
      # Model-agnostic: set ABIGAIL_BACKEND + the matching key in .abigail.env
      - ABIGAIL_BACKEND=${ABIGAIL_BACKEND:-groq}
      - ABIGAIL_HEADLESS=1
      - SENTINEL_URL=http://sentinel:8080
      # SEC-02: inside a container the app must bind all interfaces so Docker's
      # (localhost-only) published port can reach it. Container = isolation boundary.
      - ABIGAIL_BIND_HOST=0.0.0.0
      - ABIGAIL_ALLOW_NONLOCAL_BIND=1
      # Operator console: honor governed operator commands (status/help) — still
      # HAAP/command-bus governed; privileged routes remain admin-token fail-closed.
      - ABIGAIL_ALLOW_LOCAL_OPERATOR_COMMANDS=1
      # BYOAPIKEY — all providers, operator supplies the key they have
      # Auth tokens
      - ABIGAIL_ADMIN_TOKEN=${ABIGAIL_ADMIN_TOKEN}
      - ABIGAIL_DEMO_TOKEN=${ABIGAIL_DEMO_TOKEN}
      # SEC-03: token Abigail presents to the Sentinel control plane (X-Sentinel-Token)
      - SENTINEL_ADMIN_TOKEN=${SENTINEL_ADMIN_TOKEN}
      # Governance profile
      - SENTOW_INDUSTRY_PROFILE=${SENTOW_INDUSTRY_PROFILE:-consumer}
      - SENTOW_HAAP_DRS_CEILING=${SENTOW_HAAP_DRS_CEILING:-60}
    depends_on:
      sentinel:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7070/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sentinel-audit:
  sentinel-data:
  abigail-logs:
